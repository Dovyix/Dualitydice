<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daggerheart Dice</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:14px 10px;background:#20284b;color:#fff;font:16px var(--ff,sans-serif)}
body[data-m=u] .d-only{display:none!important}body[data-m=d] .u-only{display:none!important}
#tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px}#tabs button{background:transparent;border:2px solid #55609e;color:#c9d0f5;padding:3px 18px;border-radius:16px;font:18px var(--ff,sans-serif);cursor:pointer}#tabs button.on{background:#a283e0;border-color:#a283e0;color:#fff}
.top{display:flex;justify-content:center;gap:20px}.top.ex{margin-top:12px;flex-wrap:wrap;gap:10px}.col{display:flex;flex-direction:column;align-items:center;gap:8px;width:180px}.top.ex .col{width:112px}
.top.pool{flex-wrap:wrap;gap:6px 8px;min-height:170px;align-items:center;align-content:center}
.col select{width:104px;appearance:none;-webkit-appearance:none;background:transparent;color:var(--col);border:3px solid var(--col);border-radius:0;font:20px var(--ff,sans-serif);text-align:center;text-align-last:center;padding:3px 0;cursor:pointer}
.top.ex .col select{width:108px;font-size:17px}.col select option{background:#20284b;color:#fff}
#pbtns{display:flex;justify-content:center;gap:10px;margin-top:14px}.pb{position:relative;width:56px;height:56px;border-radius:50%;background:#38458d;border:0;display:grid;place-items:center;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none;touch-action:manipulation}.pb .dw{--w:34px;pointer-events:none}
.bg{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#ee5a44;color:#fff;font-size:14px;display:grid;place-items:center;padding:0 5px;pointer-events:none}
.mrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px}.ml{font-size:19px;margin-right:2px}#mod{min-width:30px;text-align:center;font-size:26px}.gap{width:6px}
.cir{width:34px;height:34px;border:3px solid #fff;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.sq{position:relative;width:34px;height:34px;border:0;border-radius:8px;background:#38458d;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}.sq svg{display:block;width:18px;height:18px}.sq .ic{width:20px;height:20px}.sq .bg{background:#fff;color:#20284b}.cir svg{display:block;width:18px;height:18px}.sq.g{background:#6dbb6d}.sq.r{background:#ff8474}.sq.o{background:#e8664a;opacity:.55}.sq.o.on{opacity:1;box-shadow:0 0 0 3px #fff}.sq.on{background:#7a64e8}.sq:disabled{opacity:.4;cursor:default}
#go{display:block;width:min(100%,400px);margin:16px auto 0;padding:10px;border:0;border-radius:8px;background:#a283e0;color:#fff;font:22px var(--ff,sans-serif);cursor:pointer}
#favs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.chip{display:flex;border:1px solid #55609e;border-radius:14px;overflow:hidden}.chip button{background:transparent;color:#fff;border:0;padding:3px 9px;cursor:pointer;font:14px var(--ff,sans-serif)}
.lh{display:flex;justify-content:space-between;margin:16px 4px 6px;color:#9aa5d8;font-size:15px}.lh button{background:none;border:0;color:#9aa5d8;cursor:pointer;font:inherit;text-decoration:underline}
#log{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px}.empty{color:#7f8ac0;text-align:center;font-size:14px;line-height:1.4}
.li{display:flex;gap:10px;align-items:center;background:#2c3460;border-left:4px solid var(--c);border-radius:6px;padding:6px 10px}.li strong{font-size:24px;min-width:34px;text-align:center;font-weight:400}.li .who{opacity:.8}.li .lab{color:var(--c)}.li .bd{font-size:14px;text-align:left}
#toast{position:fixed;right:12px;bottom:12px;z-index:5}#note{font-size:12px;color:#9aa5d8;margin-top:8px;text-align:center}
</style></head><body data-m="u">
<div id="tabs"><button data-m="u">Duality</button><button data-m="d">Dice</button></div>
<div id="dice"></div><div id="pbtns" class="d-only"></div>
<div class="mrow"><span class="ml">Modifier</span><button class="cir" id="m1"></button><span id="mod">0</span><button class="cir" id="m2"></button><span class="gap"></span>
<button class="sq g u-only" id="addA" title="Advantage d6: click to add, right-click to remove"></button><button class="sq r u-only" id="addD" title="Disadvantage d6: click to add, right-click to remove"></button>
<button class="sq o d-only" id="pw" title="Powerful: roll twice, show the best result"></button>
<button class="sq o d-only" id="rl" title="Reload: roll an extra d6 (not added); a 1 means Reloaded"></button>
<button class="sq" id="sec" title="Secret roll (only me)"></button>
<button class="sq" id="again" title="Restore previous roll" disabled></button>
<button class="sq" id="fav" title="Save favorite"></button></div>
<button id="go">Roll Duality Dice</button><div id="favs"></div><div id="note"></div>
<div class="lh"><span>Roll log</span><button id="clr">Clear</button></div><div id="log"></div><div id="toast"></div>
<script src="dice.js"></script>
<script>
const $=id=>document.getElementById(id);
const PL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',MI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 12h14"/></svg>';
$("m1").innerHTML=MI;$("m2").innerHTML=PL;
let mode="u",hs=12,fs=12,ex=[],mod=0,pool=[],pmod=0,power=false,reload=false,secret=false,OBR=null,lastU=null,lastD=null,favs=[],to,ls="",lpAt=0,lp;
$("addA").innerHTML=ico("advantage");$("addD").innerHTML=ico("disadvantage");$("pw").innerHTML=ico("powerful");$("rl").innerHTML=ico("reload");$("again").innerHTML=ico("previous");$("fav").innerHTML=ico("favorite");
const setSec=()=>{$("sec").innerHTML=ico(secret?"private":"public");$("sec").title=secret?"Secret roll: only you see it (click for public)":"Public roll: everyone sees it (click for secret)"};setSec();
try{favs=JSON.parse(localStorage.getItem("dh-fav")||"[]")}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("dh-fav",JSON.stringify(favs))}catch(e){}};
const cnt=t=>ex.filter(e=>e.t==t).length;
const fmt=m=>m>0?"+"+m:m<0?"−"+Math.abs(m):"0",sg=m=>m?` ${m>0?"+":"−"}${Math.abs(m)}`:"";
const cfg=()=>mode=="u"?{m:"u",hs,fs,mod,ex:ex.map(e=>({...e}))}:{m:"d",pool:[...pool],mod:pmod,power,reload};
const lbl=c=>c.m=="d"?poolLbl(c.pool)+sg(c.mod)+(c.power?" ⚡":"")+(c.reload?" ↻":""):`d${c.hs}/d${c.fs}`+sg(c.mod)+c.ex.map(e=>` ${e.t=="a"?"+":"−"}d${e.s}`).join("");
const opts=(k,s,main)=>SIZES.map(x=>`<option value="${x}" ${x==s?"selected":""}>${main?"":(k=="a"?"adv ":"dis ")}d${x}</option>`).join("")+(main?"":'<option value="x">remove</option>');
const col=(k,s,id,w)=>`<div class="col" style="--col:${KIND[k][1]}">${pdie(k,s,w)}<select data-i="${id}">${opts(k,s,k=="h"||k=="f")}</select></div>`;
function draw(){document.body.dataset.m=mode;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m==mode));
 if(mode=="u"){$("dice").innerHTML=`<div class="top">${col("h",hs,"h",150)}${col("f",fs,"f",150)}</div>`+(ex.length?`<div class="top ex">${ex.map((e,i)=>col(e.t,e.s,i,92)).join("")}</div>`:"")}
 else{const N=pool.length,w=N<=2?150:N<=4?104:N<=8?76:58;
  $("dice").innerHTML=`<div class="top pool">${N?pool.map(s=>pdie("w",s,w)).join(""):'<div class="empty">Click a die below to add it to the pool<br>(right-click to remove)</div>'}</div>`;
  $("pbtns").innerHTML=SIZES.map(s=>{const c=pool.filter(x=>x==s).length;return `<button class="pb" data-s="${s}" title="d${s}: click to add, right-click to remove">${pdie("w",s,34)}${c?`<span class="bg">${c}</span>`:""}</button>`}).join("");
  $("pw").classList.toggle("on",power);$("rl").classList.toggle("on",reload)}
 $("mod").textContent=fmt(mode=="u"?mod:pmod);$("go").textContent=mode=="u"?"Roll Duality Dice":"Roll the Dice";$("again").disabled=!(mode=="u"?lastU:lastD)}
const drawFavs=()=>{$("favs").innerHTML=favs.map((c,i)=>`<span class="chip"><button data-load="${i}" title="Load">${lbl(c)}</button><button data-del="${i}" title="Delete">×</button></span>`).join("")};
const drawLog=()=>{const L=logGet();ls=JSON.stringify(L);$("log").innerHTML=L.length?L.map(logItem).join(""):'<div class="empty">No rolls yet</div>'};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){mode=b.dataset.m;$("note").textContent="";draw()}};
$("dice").onchange=e=>{const t=e.target,v=t.value,i=t.dataset.i;if(i=="h")hs=+v;else if(i=="f")fs=+v;else if(v=="x")ex.splice(+i,1);else ex[i].s=+v;draw()};
const rmDie=s=>{const i=pool.lastIndexOf(s);if(i>=0){pool.splice(i,1);draw()}};
$("pbtns").onclick=e=>{const b=e.target.closest(".pb");if(!b||Date.now()-lpAt<800)return;if(pool.length<24){pool.push(+b.dataset.s);$("note").textContent="";draw()}};
$("pbtns").oncontextmenu=e=>{e.preventDefault();const b=e.target.closest(".pb");if(b&&Date.now()-lpAt>800)rmDie(+b.dataset.s)};
$("pbtns").onpointerdown=e=>{const b=e.target.closest(".pb");if(b&&e.pointerType=="touch")lp=setTimeout(()=>{lpAt=Date.now();rmDie(+b.dataset.s)},500)};
$("pbtns").onpointerup=$("pbtns").onpointercancel=$("pbtns").onpointerleave=()=>clearTimeout(lp);
$("favs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.load!=null){const c=favs[+b.dataset.load];if(c.m=="d"){mode="d";pool=[...c.pool];pmod=c.mod;power=!!c.power;reload=!!c.reload}else{mode="u";hs=c.hs;fs=c.fs;mod=c.mod;ex=c.ex.map(x=>({...x}))}draw()}
 else if(b.dataset.del!=null){favs.splice(+b.dataset.del,1);saveFavs();drawFavs()}};
$("fav").onclick=()=>{if(mode=="d"&&!pool.length)return;const c=cfg();if(!favs.some(f=>lbl(f)==lbl(c))){favs.push(c);saveFavs();drawFavs()}};
$("sec").onclick=()=>{secret=!secret;$("sec").classList.toggle("on",secret);setSec()};
$("m1").onclick=()=>{if(mode=="u")mod--;else pmod--;draw()};$("m2").onclick=()=>{if(mode=="u")mod++;else pmod++;draw()};
const rmEx=t=>{for(let i=ex.length-1;i>=0;i--)if(ex[i].t==t){ex.splice(i,1);draw();return}};
function bindAdd(id,t){const b=$(id);
 b.onclick=()=>{if(Date.now()-lpAt<800)return;ex.push({t,s:6});draw()};
 b.oncontextmenu=e=>{e.preventDefault();if(Date.now()-lpAt>800)rmEx(t)};
 b.onpointerdown=e=>{if(e.pointerType=="touch")lp=setTimeout(()=>{lpAt=Date.now();rmEx(t)},500)};
 b.onpointerup=b.onpointercancel=b.onpointerleave=()=>clearTimeout(lp)}
bindAdd("addA","a");bindAdd("addD","d");
$("pw").onclick=()=>{power=!power;draw()};$("rl").onclick=()=>{reload=!reload;draw()};
$("clr").onclick=()=>{logSet([]);drawLog()};
window.closeResult=()=>{const t=$("toast");(t._to||[]).forEach(clearTimeout);clearInterval(t._t);t.innerHTML="";clearTimeout(to)};
async function send(p){p.name=OBR?await OBR.player.getName():"You";p.secret=secret;
 if(OBR)OBR.broadcast.sendMessage("daggerheart/roll",p,{destination:secret?"LOCAL":"ALL"});
 else{play($("toast"),p);clearTimeout(to);to=setTimeout(window.closeResult,16000);setTimeout(()=>{logAdd(p);drawLog()},revealAt(dcount(p)));
  $("note").textContent="Demo mode: inside Owlbear the result pops up bottom-right for everyone (secret rolls only for you)."}}
const roll=c=>{const E=c.ex.map(e=>({...e,v:R(e.s)}));return send({h:R(c.hs),f:R(c.fs),hs:c.hs,fs:c.fs,mod:c.mod,a:E.filter(e=>e.t=="a"),d:E.filter(e=>e.t=="d")})};
const rollD=c=>{const mk=()=>c.pool.map(s=>R(s)),rolls=[mk()];if(c.power)rolls.push(mk());return send({mode:"dice",pool:c.pool,rolls,mod:c.mod,power:!!c.power,reload:c.reload?R(6):null})};
$("go").onclick=()=>{if(mode=="u"){const c=cfg();lastU=c;roll(c);hs=fs=12;ex=[];mod=0}
 else{if(!pool.length){$("note").textContent="Add dice to the pool first.";return}const c=cfg();lastD=c;rollD(c);pool=[];pmod=0;power=false;reload=false}draw()};
$("again").onclick=()=>{if(mode=="u"){if(lastU){hs=lastU.hs;fs=lastU.fs;mod=lastU.mod;ex=lastU.ex.map(e=>({...e}));draw()}}else if(lastD){pool=[...lastD.pool];pmod=lastD.mod;power=!!lastD.power;reload=!!lastD.reload;draw()}};
draw();drawFavs();drawLog();setInterval(()=>{if(JSON.stringify(logGet())!=ls)drawLog()},700);
(async()=>{try{const m=await import("https://esm.sh/@owlbear-rodeo/sdk@3.0.0");if(!m.default.isAvailable)throw 0;await new Promise(res=>m.default.onReady(res));OBR=m.default}catch(e){}})();
</script></body></html>
